name: Rule regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthy_diet_recommender(2)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python test_recipe_text.py
      - run: python test_r1_diabetes.py
      - run: python test_r5_bare_glucose.py
