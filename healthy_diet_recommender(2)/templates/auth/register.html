{% extends "base.html" %}
{% block title %}注册 - 益食安康{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>🥦 创建账号</h1>
        <p class="auth-subtitle">注册后开启您的控糖饮食管理</p>

        <form method="POST" action="{{ url_for('user.register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username"
                       placeholder="请输入用户名（2～20 个字）" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">邮箱（选填，可不填）</label>
                <input type="email" id="email" name="email"
                       placeholder="不填也能注册">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password"
                       placeholder="请输入密码（至少6位）" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">确认密码（选填）</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       placeholder="再输一次密码，防止打错" minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-block">注 册</button>
        </form>

        <p class="auth-switch">
            已有账号？<a href="{{ url_for('user.login') }}">立即登录</a>
        </p>
    </div>
</div>
{% endblock %}
