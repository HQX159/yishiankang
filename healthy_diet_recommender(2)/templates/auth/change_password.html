{% extends "base.html" %}
{% block title %}修改密码 - 益食安康{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>🔒 修改密码</h1>
        <p class="auth-subtitle">为保障账号安全，请先验证原密码</p>

        <form method="POST" action="{{ url_for('user.change_password') }}" class="auth-form">
            <div class="form-group">
                <label for="old_password">原密码</label>
                <input type="password" id="old_password" name="old_password"
                       placeholder="请输入当前密码" required autofocus>
            </div>

            <div class="form-group">
                <label for="new_password">新密码</label>
                <input type="password" id="new_password" name="new_password"
                       placeholder="请输入新密码（至少6位）" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">确认新密码</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       placeholder="请再次输入新密码" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-block">确认修改</button>
        </form>

        <p class="auth-switch">
            <a href="{{ url_for('dashboard') }}">返回仪表盘</a>
        </p>
    </div>
</div>
{% endblock %}
